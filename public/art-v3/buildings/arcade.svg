.glow{animation:gl 2.4s ease-in-out infinite;transform-origin:120px 70px}
@keyframes gl{0%,100%{opacity:.35}50%{opacity:.7}}
</style>
<ellipse cx="120" cy="248" rx="104" ry="10" fill="#3b2f3a" opacity=".15" stroke="none"/>
