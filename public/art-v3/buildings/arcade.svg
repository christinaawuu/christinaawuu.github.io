<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 282 260" fill="none" stroke="#3b2f3a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<!-- depth: cast shadow, side wall, roof edge -->
<path d="M212 244 L274 236 L274 256 L212 254z" fill="#3b2f3a" opacity=".16" stroke="none"/>
<path d="M212 82 L248 60 L248 222 L212 244z" fill="#b8384a"/>
<g transform="translate(212 82) matrix(1 -0.6111 0 1 0 0)" stroke-width="2"><rect x="8" y="14" width="20" height="27" rx="3" fill="#cfe8f3" opacity=".85" stroke-width="2"/><rect x="8" y="68" width="20" height="27" rx="3" fill="#cfe8f3" opacity=".85" stroke-width="2"/><rect x="8" y="122" width="20" height="27" rx="3" fill="#cfe8f3" opacity=".85" stroke-width="2"/></g>
<path d="M212 82 L248 60 L248 222 L212 244z" fill="none"/>
