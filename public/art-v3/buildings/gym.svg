<path d="M212 84 L248 62 L248 222 L212 244z" fill="#2f3a63"/>
<g transform="translate(212 84) matrix(1 -0.6111 0 1 0 0)" stroke-width="2"><rect x="8" y="13" width="20" height="27" rx="3" fill="#cfe8f3" opacity=".85" stroke-width="2"/><rect x="8" y="67" width="20" height="27" rx="3" fill="#cfe8f3" opacity=".85" stroke-width="2"/><rect x="8" y="120" width="20" height="27" rx="3" fill="#cfe8f3" opacity=".85" stroke-width="2"/></g>
<path d="M212 84 L248 62 L248 222 L212 244z" fill="none"/>
