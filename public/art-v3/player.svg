<svg xmlns="http://www.w3.org/2000/svg" class="pl" viewBox="0 0 72 112" fill="none" stroke="#3b2f3a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" data-dir="front">
<style>
.pl[data-dir=front] .back, .pl[data-dir=front] .side,
.pl[data-dir=back] .front, .pl[data-dir=back] .side,
.pl[data-dir=left] .front, .pl[data-dir=left] .back,
.pl[data-dir=right] .front, .pl[data-dir=right] .back { display: none }
.pl[data-dir=right] .side { transform: translateX(72px) scaleX(-1) }
.pl .body { animation: idle 1.6s ease-in-out infinite }
@keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.2px) } }
.pl.moving .body { animation: hop .34s ease-in-out infinite }
@keyframes hop { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
.pl.moving .legA { animation: stepA .34s ease-in-out infinite }
.pl.moving .legB { animation: stepB .34s ease-in-out infinite }
@keyframes stepA { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
@keyframes stepB { 0%,100% { transform: translateY(-4px) } 50% { transform: translateY(0) } }
.pl.moving .swingA { animation: swA .34s ease-in-out infinite; transform-origin: 36px 82px }
.pl.moving .swingB { animation: swB .34s ease-in-out infinite; transform-origin: 36px 82px }
@keyframes swA { 0%,100% { transform: rotate(-14deg) } 50% { transform: rotate(14deg) } }
@keyframes swB { 0%,100% { transform: rotate(14deg) } 50% { transform: rotate(-14deg) } }
</style>
<ellipse cx="36" cy="106" rx="20" ry="5" fill="#3b2f3a" opacity=".22" stroke="none"/>

<!-- ============ FRONT ============ -->
<g class="front">
 <g class="legA"><path d="M24 76h13l2 22H21z" fill="#3b3a4a"/><rect x="18" y="96" width="21" height="9" rx="4.5" fill="#fdf6ec"/></g>
 <g class="legB"><path d="M35 76h13l3 22H33z" fill="#3b3a4a"/><rect x="33" y="96" width="21" height="9" rx="4.5" fill="#fdf6ec"/></g>
 <g class="body">
  <!-- long hair behind -->
  <path d="M12 30c-6 14-6 34 0 48h48c6-14 6-34 0-48z" fill="#2b2433"/>
  <!-- coat -->
  <path d="M17 48q0-8 19-8t19 8l4 34H13z" fill="#d1a97d"/>
  <path d="M30 42h12l-1 38H31z" fill="#fdf6ec" stroke-width="2"/>
  <path d="M30 42l-5 14M42 42l5 14" stroke-width="2"/>
  <path d="M14 70h44" stroke="#a98259" stroke-width="3"/>
  <rect x="8" y="46" width="10" height="26" rx="5" fill="#d1a97d"/><rect x="54" y="46" width="10" height="26" rx="5" fill="#d1a97d"/>
  <circle cx="13" cy="74" r="4.5" fill="#f6d3b3"/><circle cx="59" cy="74" r="4.5" fill="#f6d3b3"/>
  <!-- crossbody bag -->
  <path d="M52 44L24 78" stroke="#3d4a7a" stroke-width="3"/><rect x="18" y="72" width="16" height="12" rx="3" fill="#3d4a7a"/>
  <!-- hair locks over shoulders -->
  <path d="M15 34c-5 12-5 26-1 38l12 3c1-14 1-28-2-40z" fill="#2b2433"/><path d="M57 34c5 12 5 26 1 38l-12 3c-1-14-1-28 2-40z" fill="#2b2433"/>
  <path d="M19 44c-1 8-1 16 0 24M53 44c1 8 1 16 0 24" stroke="#4a3d5a" stroke-width="2"/>
  <!-- head -->
  <ellipse cx="36" cy="27" rx="17" ry="18" fill="#f6d3b3"/>
  <!-- middle part hair -->
  <path d="M16 29c-2-16 8-24 20-24s22 8 20 24c-3-9-9-16-20-19-11 3-17 10-20 19z" fill="#2b2433"/>
  <path d="M36 9v1" stroke="#f6d3b3" stroke-width="2"/>
  <path d="M24 16c3-3 7-5 12-6" stroke="#5a4a66" stroke-width="2"/>
  <ellipse cx="29" cy="30" rx="2.2" ry="2.8" fill="#2b2433" stroke="none"/><ellipse cx="43" cy="30" rx="2.2" ry="2.8" fill="#2b2433" stroke="none"/>
  <circle cx="24.5" cy="36" r="3" fill="#f59a9a" stroke="none" opacity=".6"/><circle cx="47.5" cy="36" r="3" fill="#f59a9a" stroke="none" opacity=".6"/>
  <path d="M33 38q3 2.5 6 0" stroke-width="2"/>
 </g>
</g>

<!-- ============ BACK ============ -->
<g class="back">
 <g class="legA"><path d="M24 76h13l2 22H21z" fill="#3b3a4a"/><rect x="18" y="96" width="21" height="9" rx="4.5" fill="#fdf6ec"/></g>
 <g class="legB"><path d="M35 76h13l3 22H33z" fill="#3b3a4a"/><rect x="33" y="96" width="21" height="9" rx="4.5" fill="#fdf6ec"/></g>
 <g class="body">
  <path d="M17 48q0-8 19-8t19 8l4 34H13z" fill="#d1a97d"/>
  <path d="M36 42v38" stroke-width="2"/><path d="M14 70h44" stroke="#a98259" stroke-width="3"/>
  <rect x="8" y="46" width="10" height="26" rx="5" fill="#d1a97d"/><rect x="54" y="46" width="10" height="26" rx="5" fill="#d1a97d"/>
  <path d="M52 44L24 78" stroke="#3d4a7a" stroke-width="3"/>
  <!-- long hair back -->
  <path d="M13 28c-2-16 8-24 23-24s25 8 23 24c5 16 4 34-1 50-7 4-14 4-22 3-8 1-15 1-22-3-5-16-6-34-1-50z" fill="#2b2433"/>
  <path d="M36 10v66" stroke="#3f3450" stroke-width="2"/><path d="M24 20c-3 14-3 32 0 50M48 20c3 14 3 32 0 50" stroke="#4a3d5a" stroke-width="2"/>
 </g>
</g>

<!-- ============ SIDE (faces left) ============ -->
<g class="side">
 <g class="swingB"><path d="M31 76h12l2 22H29z" fill="#2f2e3c"/><rect x="25" y="96" width="21" height="9" rx="4.5" fill="#e8e0d4"/></g>
 <g class="swingA"><path d="M30 76h12l2 22H28z" fill="#3b3a4a"/><rect x="22" y="96" width="21" height="9" rx="4.5" fill="#fdf6ec"/></g>
 <g class="body">
  <!-- coat -->
  <path d="M24 48q0-8 12-8t12 8l2 34H22z" fill="#d1a97d"/>
  <path d="M26 70h24" stroke="#a98259" stroke-width="3"/>
  <rect x="38" y="68" width="14" height="12" rx="3" fill="#3d4a7a"/>
  <!-- full hair mass behind the head, falling over the back, connected to the skull -->
  <path d="M28 8C48 2 62 16 60 38c-1 12 0 24-3 36-3 6-13 6-18 0-2-8-2-14-4-20-8-4-12-14-12-26z" fill="#2b2433"/>
  <path d="M46 20c4 12 4 30 1 46M54 24c3 12 3 28 0 44" stroke="#4a3d5a" stroke-width="2"/>
  <!-- arm -->
  <rect x="30" y="46" width="12" height="28" rx="6" fill="#d1a97d"/><circle cx="36" cy="76" r="4.5" fill="#f6d3b3"/>
  <!-- head -->
  <ellipse cx="33" cy="27" rx="16" ry="18" fill="#f6d3b3"/>
  <!-- hair cap over the top and back of the skull, with side-swept part -->
  <path d="M16 28C14 12 24 5 35 5c11 0 19 8 18 22-1 4-3 8-6 10-1-8-4-14-9-18-8 0-16 2-22 9z" fill="#2b2433"/>
  <path d="M22 14c4-4 10-6 16-6" stroke="#5a4a66" stroke-width="2"/>
  <ellipse cx="24" cy="30" rx="2" ry="2.8" fill="#2b2433" stroke="none"/>
  <circle cx="22" cy="36" r="3" fill="#f59a9a" stroke="none" opacity=".6"/>
  <path d="M19 34l-2 3 3 1" stroke-width="2"/>
 </g>
</g>
</svg>
