<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Art kit | Christina Wu</title>
<style>
  body { margin: 0; font-family: 'Nunito','Segoe UI',system-ui,sans-serif; background: #fdf6ec; color: #2b2433; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { margin: 0 0 4px; } h2 { margin: 36px 0 12px; }
  p { color: #6d6578; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: .8rem; font-weight: 700; color: #6d6578; margin-top: 6px; }
  .street { background: #d9d3c4; border-radius: 18px; padding: 24px; }
  .sw { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw div { width: 92px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.1); background: #fff; font-size: .7rem; text-align: center; }
  .sw span { display: block; height: 44px; }
  .sw b { display: block; padding: 4px 0; }
  img.b { height: 200px; } img.p { height: 90px; } img.c { height: 160px; }
  label { font-weight: 700; display: inline-flex; gap: 6px; align-items: center; margin-bottom: 12px; }
  body.night { background: #1d1a2b; color: #fdf6ec; } body.night .street { background: #2a2740; } body.night figcaption, body.night p { color: #b8b2c8; }
  body.night img { filter: brightness(.78) saturate(1.1); }
</style>
</head>
<body>
<main>
  <h1>Art kit</h1>
  <p>Phase 2 review. Cozy, crisp vector style with a soft outline, warm palette, and a gentle animation on each piece.</p>
  <label><input type="checkbox" id="night" /> Night mode (see the glows)</label>

  <h2>Palette</h2>
  <div class="sw" id="sw"></div>

  <h2>Landmarks</h2>
  <div class="street"><div class="row" id="b"></div></div>

  <h2>Street props</h2>
  <div class="street"><div class="row" id="p"></div></div>

  <h2>Character</h2>
  <div class="street"><div class="row" id="c"></div></div>

  <h2>Mini scene</h2>
  <div class="street" style="display:flex;gap:12px;align-items:flex-end;justify-content:center;flex-wrap:wrap">
    <img src="art/props/tree.svg" height="130" alt="" /><img src="art/buildings/arcade.svg" height="240" alt="" /><img src="art/props/streetlamp.svg" height="140" alt="" />
    <img src="art/characters/player.svg" height="110" alt="" /><img src="art/props/taxi.svg" height="80" alt="" /><img src="art/buildings/lab.svg" height="240" alt="" /><img src="art/props/hydrant.svg" height="60" alt="" />
  </div>
</main>
<script>
const colors = { Outline:'#3b2f3a', Cream:'#fdf6ec', Coral:'#e8505b', Teal:'#4f9d8f', Blue:'#4c7bd9', Amber:'#e9a23b', Purple:'#9a6fd1', Slate:'#6b7f94', Sage:'#8fb996', Taxi:'#f6c453', Window:'#cfe8f3', Glow:'#ffe9a8' };
sw.innerHTML = Object.entries(colors).map(([n,c]) => `<div><span style="background:${c}"></span><b>${n}</b>${c}</div>`).join('');
const fig = (src, cls, label) => `<figure><img class="${cls}" src="art/${src}.svg" alt="${label}" /><figcaption>${label}</figcaption></figure>`;
b.innerHTML = [['arcade','Times Square'],['lab','Chelsea'],['bank','Financial District'],['gallery','SoHo'],['warehouse','DUMBO'],['office','Midtown'],['bodega','Bodega (About me)']].map(([f,l]) => fig('buildings/'+f,'b',l)).join('');
p.innerHTML = ['taxi','subway-entrance','hotdog-cart','tree','streetlamp','hydrant','bench','manhole-steam'].map(f => fig('props/'+f,'p',f.replace('-',' '))).join('');
c.innerHTML = fig('characters/player','c','Player (placeholder look)');
night.onchange = () => document.body.classList.toggle('night', night.checked);
</script>
</body>
</html>
