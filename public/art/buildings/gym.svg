<rect x="20" y="84" width="200" height="20" rx="6" fill="#2f3a63"/>
<!-- dumbbell sign -->
<g class="lift">
<rect x="96" y="38" width="48" height="12" rx="5" fill="#cfc8d6"/>
<rect x="76" y="24" width="14" height="40" rx="5" fill="#e8505b"/><rect x="62" y="30" width="12" height="28" rx="4" fill="#c63d49"/>
<rect x="150" y="24" width="14" height="40" rx="5" fill="#e8505b"/><rect x="166" y="30" width="12" height="28" rx="4" fill="#c63d49"/>
</g>
<!-- big window with silhouettes -->
<rect x="44" y="116" width="152" height="52" rx="8" fill="#cfe8f3"/>
<path d="M82 116v52M120 116v52M158 116v52" stroke-width="2"/>
<g fill="#3b2f3a" stroke="none" opacity=".75"><circle cx="63" cy="132" r="6"/><rect x="57" y="140" width="12" height="24" rx="5"/><circle cx="101" cy="132" r="6"/><rect x="95" y="140" width="12" height="24" rx="5"/><circle cx="139" cy="132" r="6"/><rect x="133" y="140" width="12" height="24" rx="5"/><circle cx="177" cy="132" r="6"/><rect x="171" y="140" width="12" height="24" rx="5"/></g>
<!-- door and stripe -->
<rect x="96" y="178" width="48" height="66" rx="7" fill="#ffe9a8"/><path d="M120 178v66" stroke-width="2"/>
<rect x="40" y="184" width="44" height="12" rx="6" fill="#e8505b" stroke-width="2.5"/><rect x="156" y="184" width="44" height="12" rx="6" fill="#e8505b" stroke-width="2.5"/>
<rect x="40" y="206" width="44" height="12" rx="6" fill="#4f9d8f" stroke-width="2.5"/><rect x="156" y="206" width="44" height="12" rx="6" fill="#4f9d8f" stroke-width="2.5"/>
