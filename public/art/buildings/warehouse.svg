<rect x="62" y="184" width="116" height="80" rx="6" fill="#ffe9a8"/>
<path d="M120 184v80" stroke-width="2"/>
<g class="cube"><path d="M120 196l20 10v22l-20 10-20-10v-22z" fill="#9a6fd1" stroke-width="2.5"/><path d="M100 206l20 10 20-10M120 216v22" stroke-width="2.5"/></g>
<rect x="30" y="232" width="24" height="32" rx="4" fill="#7b52b0"/><rect x="186" y="232" width="24" height="32" rx="4" fill="#7b52b0"/>
</svg>
