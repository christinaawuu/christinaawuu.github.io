<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none" stroke="#3b2f3a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<style>
.glow{animation:gl 2.4s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.3}50%{opacity:.65}}
.cube{animation:rot 5s ease-in-out infinite;transform-origin:120px 170px}
@keyframes rot{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<ellipse cx="120" cy="268" rx="104" ry="10" fill="#3b2f3a" opacity=".15" stroke="none"/>
<circle class="glow" cx="120" cy="170" r="92" fill="#cdb3ff" stroke="none"/>
