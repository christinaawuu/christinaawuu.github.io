<path d="M84 52h72v40H84z" fill="#8a5a44"/>
<path d="M80 52l40-22 40 22z" fill="#6e4535"/>
<path d="M96 92v22M144 92v22M96 114h48" />
<path d="M92 66h56M92 78h56" stroke-width="2"/>
<rect x="26" y="112" width="188" height="152" rx="8" fill="#9a6fd1"/>
<rect x="18" y="102" width="204" height="18" rx="6" fill="#7b52b0"/>
<!-- brick lines -->
<path d="M26 134h188M26 156h188M26 178h188M26 200h188" stroke-width="1.5" opacity=".25"/>
<!-- arched windows -->
<g fill="#cfe8f3"><path d="M40 168v-24a16 16 0 0132 0v24z"/><path d="M104 168v-24a16 16 0 0132 0v24z"/><path d="M168 168v-24a16 16 0 0132 0v24z"/></g>
<path d="M56 130v38M120 130v38M184 130v38" stroke-width="2"/>
