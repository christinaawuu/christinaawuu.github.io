<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 130" fill="none" stroke="#3b2f3a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<style>.wheel{animation:sp 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}.lamp{animation:bl 1.6s steps(1) infinite}@keyframes bl{0%{fill:#8be0a4}50%{fill:#fdf6ec}}</style>
<ellipse cx="130" cy="118" rx="120" ry="9" fill="#3b2f3a" opacity=".18" stroke="none"/>
