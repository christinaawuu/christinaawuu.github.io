<rect x="14" y="96" width="232" height="14" rx="5" fill="#5b5566"/>
<g stroke-width="2.5"><rect x="24" y="92" width="10" height="8" rx="2" fill="#cfc8d6"/><rect x="104" y="92" width="10" height="8" rx="2" fill="#cfc8d6"/><rect x="184" y="92" width="10" height="8" rx="2" fill="#cfc8d6"/></g>
<!-- kiosk -->
<rect x="212" y="30" width="34" height="68" rx="6" fill="#3a7bd5"/><rect x="218" y="38" width="22" height="18" rx="3" fill="#cfe8f3" stroke-width="2.5"/><circle class="lamp" cx="229" cy="68" r="4" fill="#8be0a4" stroke-width="2"/><rect x="220" y="78" width="18" height="6" rx="2" fill="#fdf6ec" stroke-width="2"/>
<!-- three bikes -->
<g id="bk"><circle class="wheel" cx="34" cy="84" r="14" fill="none"/><circle class="wheel" cx="76" cy="84" r="14" fill="none"/><circle cx="34" cy="84" r="3" fill="#3b2f3a"/><circle cx="76" cy="84" r="3" fill="#3b2f3a"/>
<path d="M34 84l16-30h22l4 30M50 54l-6-10h-8M72 54l2-12h8" stroke="#3a7bd5" stroke-width="5"/><path d="M40 44h8" stroke="#3b2f3a" stroke-width="4"/><rect x="62" y="48" width="16" height="10" rx="3" fill="#fdf6ec" stroke-width="2.5"/></g>
<use href="#bk" x="80"/><use href="#bk" x="160" opacity="0"/>
</svg>
